[project]
name = "raspi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.129.2",
    "firebase-admin>=7.1.0",
    "pyrebase4>=4.9.0",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = ["setuptools>=82.0.0"]

[tool.setuptools.packages.find]
# vendor/ contains the pyrf24 C++ source tree, not a Python package.
# Without this, setuptools sees ['rf24', 'vendor'] and refuses to build raspi.
exclude = ["vendor*"]
